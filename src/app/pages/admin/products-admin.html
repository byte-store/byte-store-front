<app-alert kind="error" [message]="error()" />
<app-alert kind="success" [message]="notice()" />

<form ngNativeValidate (ngSubmit)="onCreate()" class="form box">
  <h3>Nuevo producto</h3>
  <label>
    Marca *
    <input name="brand" required maxlength="80" [(ngModel)]="brand" />
  </label>
  <label>
    Modelo *
    <input name="model" required maxlength="120" [(ngModel)]="model" />
  </label>
  <label>
    Precio *
    <input type="number" name="price" required min="0" step="0.01" [(ngModel)]="price" />
  </label>
  <label>
    Stock *
    <input type="number" name="stock" required min="0" step="1" [(ngModel)]="stock" />
  </label>
  <label>
    URL de imagen
    <input name="imageUrl" maxlength="255" [(ngModel)]="imageUrl" />
  </label>
  <label>
    ID de categoría (opcional, tiene que existir en la tabla categories)
    <input type="number" name="categoryId" min="1" step="1" [(ngModel)]="categoryId" />
  </label>
  <label>
    Descripción
    <textarea name="description" rows="3" [(ngModel)]="description"></textarea>
  </label>
  <button>Crear producto</button>
</form>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Producto</th>
      <th>Precio</th>
      <th>Stock</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.brand }} {{ p.model }}</td>
        <td>{{ formatPrice(p.price) }}</td>
        <td>{{ p.stock }}</td>
        <td><button class="danger" (click)="onDelete(p)">Eliminar</button></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">No hay productos</td>
      </tr>
    }
  </tbody>
</table>
