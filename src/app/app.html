<header class="navbar">
  <a routerLink="/" class="brand">ByteStore</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Catálogo
    </a>
    @if (auth.session(); as session) {
      <a routerLink="/carrito" routerLinkActive="active">Carrito</a>
      @if (session.role === 'admin') {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
      <a routerLink="/cuenta" routerLinkActive="active">Mi cuenta ({{ session.email }})</a>
      <button (click)="logout()">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Ingresar</a>
      <a routerLink="/registro" routerLinkActive="active">Crear cuenta</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
